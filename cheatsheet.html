      <div class="pack-head"><h3><a href="${p.url}" target="_blank" rel="noopener">${p.name}</a></h3>
        <span class="stars">★ ${fmt(p.stars)}</span></div>
      <div class="pack-install">${p.install}</div>
      <div class="pack-note">${p.note}</div>
      ${groups}
    </div>`;
  }).join('');
}
init();
</script>
</body>
</html>
